name: Daily Content Engine

on:
  schedule:
    # 09:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

  workflow_dispatch:

concurrency:
  group: roshini-daily-content
  cancel-in-progress: false

jobs:
  generate-content:
    name: Generate Daily Content
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata

      # AI Providers
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

      # Website
      WEBSITE_API_URL: https://roshini-backend.onrender.com/api
      WEBSITE_API_KEY: ${{ secrets.WEBSITE_API_KEY }}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python Version
        run: |
          python --version

      - name: Verify Required Secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Error: GEMINI_API_KEY is not set."; exit 1; fi
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "Error: OPENROUTER_API_KEY is not set."; exit 1; fi
          if [ -z "$GROQ_API_KEY" ]; then echo "Error: GROQ_API_KEY is not set."; exit 1; fi

      - name: Run Daily Content Engine
        run: |
          python run_pipeline.py --mode daily

      - name: Upload Generated Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_number }}
          retention-days: 7
          path: |
            outputs/**
            history/**
            logs/**

      - name: Commit Generated Content
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/
          git add history/previous-posts.md

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(content): daily content $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          fi